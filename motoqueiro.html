<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entregas — Motoqueiro</title>
<meta name="theme-color" content="#2F5233">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest-motoqueiro.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entregas">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.min.js"></script>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  APP DO MOTOQUEIRO — Select Sabor                          v1.4      ║
  ╠══════════════════════════════════════════════════════════════════════╣
  ║  · Login individual (e-mail + senha criados em Motoqueiro > Cadastro)║
  ║  · Lê os pedidos de ENTREGA da loja do motoqueiro (caixa/pedidos)    ║
  ║  · Avisa (som + vibração + notificação) quando uma entrega fica      ║
  ║    PRONTA PARA SAIR — com o app aberto ou em segundo plano          ║
  ║  · Ações: Saí para entrega → Entregue (ou desfazer)                  ║
  ║  · Só grava status/hist/motoqueiro (ver firebase-database.rules.json)║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<style>
:root {
  --verde: #2F5233; --verde2: #3F7A47; --verde-bg: #E8F1E9;
  --bg: #F2F0EA; --card: #fff; --txt: #1F2A22; --mut: #6B7280; --borda: #E3DED3;
  --roxo: #7C3AED; --azul: #0891B2; --ok: #16A34A; --erro: #B91C1C; --erro-bg: #FEE2E2;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh; overflow-x: hidden; }
@supports (height: 100dvh) { body { min-height: 100dvh; } }
button, input { font: inherit; max-width: 100%; }
button { cursor: pointer; }
.hide { display: none !important; }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 14px; }

/* Login */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: linear-gradient(160deg, var(--verde), #1d3a22); }
.login-box { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 26px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.login-box img { width: 76px; height: 76px; border-radius: 50%; display: block; margin: 0 auto 10px; }
.login-box h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
.login-box p.sub { margin: 0 0 18px; text-align: center; color: var(--mut); font-size: 14px; }
.login-box .senha-wrap { position: relative; }
.login-box .senha-wrap input { padding-right: 56px; }
.login-box .ver-senha { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 0; background: transparent; font-size: 22px; cursor: pointer; padding: 0; }
.login-box label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 4px; }
.login-box input { width: 100%; padding: 13px 12px; border: 1.5px solid var(--borda); border-radius: 12px; font-size: 16px; background: #fff; }
.login-box input:focus { outline: 0; border-color: var(--verde2); }
.btn-prim { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px; background: var(--verde); color: #fff; font-weight: 800; font-size: 17px; }
.btn-prim:disabled { opacity: .6; }
.msg-erro { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--erro-bg); color: var(--erro); font-size: 14px; }

/* Topo */
.top { background: linear-gradient(160deg, var(--verde), var(--verde2)); color: #fff; padding: calc(12px + var(--safe-t)) 0 14px; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
.top .wrap { display: flex; align-items: center; gap: 10px; }
.top .quem { flex: 1; min-width: 0; }
.top .quem b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .quem small { opacity: .9; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #F59E0B; display: inline-block; }
.dot.on { background: #4ADE80; }
.ib { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 12px; min-width: 44px; height: 44px; font-size: 18px; }
.ib.off { opacity: .55; }

/* Avisos */
.aviso { margin: 12px 0 0; padding: 12px; border-radius: 12px; background: #FEF3C7; color: #78350F; border: 1px solid #FDE68A; font-size: 14px; }
.aviso button { margin-top: 8px; padding: 10px 14px; border: 0; border-radius: 10px; background: #B45309; color: #fff; font-weight: 700; }

/* Métricas e abas */
.mets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 12px; }
.met { background: var(--card); border-radius: 14px; padding: 10px 12px; border: 1px solid var(--borda); }
.met small { display: block; font-size: 11px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .4px; }
.met b { font-size: 24px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 11px 4px; border-radius: 12px; border: 1.5px solid var(--borda); background: #fff; font-weight: 700; font-size: 13px; color: var(--txt); }
.tabs button.on { background: var(--verde); border-color: var(--verde); color: #fff; }

/* Cartões */
.card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--borda); border-left: 6px solid var(--cor, var(--roxo)); }
.card.vazio { border-left-width: 1px; text-align: center; color: var(--mut); padding: 30px 12px; }
.card .cab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card .cod { font-weight: 800; font-size: 17px; }
.card .hora { font-size: 13px; color: var(--mut); }
.end { margin-top: 10px; font-size: 19px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.end small { display: block; margin-top: 3px; font-size: 13px; font-weight: 500; color: var(--mut); }
.cli { margin-top: 8px; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.links a, .links button { flex: 1 1 calc(33% - 8px); display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; padding: 11px 8px; border-radius: 12px; border: 1.5px solid var(--borda); background: #fff; color: var(--txt); font-weight: 700; font-size: 14px; }
.prep { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-weight: 700; line-height: 1.35; background: #FEF3C7; color: #78350F; }
.prep small { display: block; font-weight: 500; margin-top: 2px; }
.cobrar { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-weight: 700; line-height: 1.35; }
.cobrar small { display: block; font-weight: 500; margin-top: 2px; }
.cobrar.dinheiro { background: #FEF3C7; color: #78350F; }
.cobrar.pix { background: #CFFAFE; color: #164E63; }
.cobrar.cartao { background: #E0E7FF; color: #312E81; }
.itens { margin-top: 10px; font-size: 14px; color: #374151; overflow-wrap: anywhere; }
.obs { margin-top: 8px; padding: 8px 10px; background: #F3F4F6; border-radius: 10px; font-size: 14px; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.acoes button { flex: 1 1 140px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--borda); background: #fff; font-weight: 800; font-size: 16px; }
.acoes button.p { background: var(--verde); border-color: var(--verde); color: #fff; }
.acoes button:disabled { opacity: .6; }
.ganhos { margin: 0 0 12px; }
.ganhos-top { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
.ganhos-top h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.ganhos-top button { border: 0; background: none; padding: 2px 4px; font-size: 18px; line-height: 1; cursor: pointer; }
.ganhos-g { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; align-items: stretch; }
.g-box { background: #fff; border: 1px solid var(--borda); border-radius: 16px; padding: 12px 14px; min-width: 0; }
.g-dia { background: #F3F4F6; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.g-dia small { font-size: 12px; color: var(--mut); font-weight: 600; }
.g-dia b { display: block; font-size: 26px; line-height: 1.1; white-space: nowrap; }
.g-dia .rua { font-size: 11px; color: var(--mut); }
.g-dia .saldo { font-size: 12px; font-weight: 700; padding-top: 6px; border-top: 1px dashed var(--borda); }
.g-st { display: flex; flex-direction: column; justify-content: center; }
.g-st .l { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 0; font-size: 13px; color: var(--mut); }
.g-st .l b { font-size: 18px; color: var(--txt); }
.resumo { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--borda); }
.resumo h3 { margin: 0 0 8px; font-size: 15px; }
.resumo .l { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--borda); font-size: 15px; }
.resumo .l:last-child { border-bottom: 0; }
.rodape { text-align: center; color: var(--mut); font-size: 12px; padding: 14px 0 calc(24px + var(--safe-b)); }

/* Toast e modal */
#toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%) translateY(30px); background: #111827; color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 600; max-width: 92vw; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.erro { background: var(--erro); }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 70; padding: 14px; }
#modal .m { background: #fff; width: 100%; max-width: 420px; border-radius: 18px; padding: 18px; margin-bottom: var(--safe-b); }
#modal h3 { margin: 0 0 8px; }
#modal .bs { display: flex; gap: 8px; margin-top: 16px; }
#modal .bs button { flex: 1; min-height: 50px; border-radius: 12px; border: 1.5px solid var(--borda); background: #fff; font-weight: 800; }
#modal .bs button.p { background: var(--verde); border-color: var(--verde); color: #fff; }
/* Alerta grande de nova entrega (tela aberta) */
#alerta { position: fixed; left: 12px; right: 12px; top: calc(76px + var(--safe-t)); z-index: 55; background: var(--roxo); color: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 12px 30px rgba(0,0,0,.35); font-weight: 800; animation: pulso 1s ease-in-out 3; }
#alerta small { display: block; font-weight: 500; opacity: .95; margin-top: 2px; }
@keyframes pulso { 50% { transform: scale(1.03); } }
/* Tela de chamada: toca e vibra até aceitar ou recusar */
#chamada { position: fixed; inset: 0; z-index: 80; background: linear-gradient(160deg, #4C1D95, #7C3AED); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(24px + var(--safe-t)) 22px calc(24px + var(--safe-b)); }
#chamada .ic { font-size: 76px; animation: tremer .9s ease-in-out infinite; }
#chamada h2 { margin: 6px 0 4px; font-size: 26px; }
#chamada .cd { font-size: 34px; font-weight: 900; letter-spacing: 3px; margin: 6px 0; }
#chamada .en { font-size: 18px; font-weight: 600; max-width: 420px; line-height: 1.35; }
#chamada .tx { margin-top: 10px; font-size: 16px; opacity: .95; }
#chamada .mais { margin-top: 8px; font-size: 14px; opacity: .85; }
#chamada .bs { display: flex; gap: 14px; width: 100%; max-width: 420px; margin-top: 34px; }
#chamada .bs button { flex: 1; min-height: 72px; border: 0; border-radius: 40px; font-size: 20px; font-weight: 900; color: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
#chamada .bs .ac { background: var(--ok); animation: pulso 1s ease-in-out infinite; }
#chamada .bs .rc { background: var(--erro); }
@keyframes tremer { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(14deg); } 60% { transform: rotate(-10deg); } 80% { transform: rotate(10deg); } }
@media (max-width: 380px) { .links a, .links button { flex: 1 1 calc(50% - 8px); } }

/* ===== Visual premium (igual ao conceito do Select Sabor) ===== */
:root { --bg: #F8F3E8; --marrom: #8A4F12; }
.top { background: linear-gradient(160deg, var(--verde), var(--verde2)); color: #fff; border-bottom: 0; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
.top .logo { width: 48px; height: 48px; border-radius: 50%; background: #fff; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
.top .quem b { color: #fff; font-size: 19px; }
.top .quem small { color: #fff; opacity: .9; }
.top .ib { background: rgba(255,255,255,.16); color: #fff; border: 0; box-shadow: none; }
.mets { gap: 10px; }
.met { text-align: center; background: linear-gradient(160deg, var(--verde), var(--verde2)); border: 0; color: #fff; padding: 12px 6px; box-shadow: 0 4px 12px rgba(47,82,51,.25); display: flex; flex-direction: column; align-items: center; }
.met::before { font-size: 24px; line-height: 1.1; }
.met:nth-child(1)::before { content: "📦"; } .met:nth-child(2)::before { content: "🛵"; } .met:nth-child(3)::before { content: "✅"; }
.met b { order: 2; font-size: 26px; line-height: 1.1; }
.met small { order: 3; color: #fff; text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; opacity: .95; }
.tabs button { border-color: #E9DDC2; }
.card { border: 1px solid #EADFC6; border-left: 1px solid #EADFC6; border-radius: 18px; box-shadow: 0 4px 14px rgba(80,60,20,.09); }
.card.vazio { box-shadow: none; }
.card .cab { align-items: center; }
.card .cod { font-size: 20px; color: var(--txt); }
.card .badge { margin-left: auto; font-size: 13px; font-weight: 800; padding: 4px 12px; border-radius: 99px; color: #fff; background: var(--cor, var(--roxo)); }
.card .hora { flex-basis: 100%; margin-top: 2px; }
.end { font-size: 17px; }
.links button { flex: 1 1 100%; min-height: 48px; background: var(--verde); border-color: var(--verde); color: #fff; font-weight: 800; font-size: 16px; }
.btn-atualizar { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; margin-top: 4px; border: 0; border-radius: 16px; background: linear-gradient(160deg, var(--verde), var(--verde2)); color: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 6px 16px rgba(47,82,51,.3); }
/* ===== Adaptação a telas maiores (o uso principal continua sendo o celular) ===== */
:root { --w-mot: 560px; }
.wrap { max-width: var(--w-mot); }
@media (min-width: 700px) { :root { --w-mot: 720px; } }
@media (min-width: 1100px) {
  :root { --w-mot: 1000px; }
  #lista { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; align-items: start; }
  #lista .card.vazio { grid-column: 1 / -1; }
}
#alerta { left: max(12px, calc(50% - 280px)); right: max(12px, calc(50% - 280px)); }
@media (max-height: 480px) {
  #chamada { overflow-y: auto; }
  #chamada .ic { font-size: 44px; }
  #chamada h2 { font-size: 22px; }
  #chamada .cd { font-size: 26px; }
  #chamada .bs { margin-top: 16px; }
  #chamada .bs button { min-height: 56px; }
}
/* ===== Preenche a tela toda (o conteúdo acompanha a largura do aparelho) ===== */
:root { --w-mot: 100%; }
.wrap { padding-left: clamp(14px, 2.5vw, 48px); padding-right: clamp(14px, 2.5vw, 48px); }
@media (min-width: 700px) {
  #lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 0 16px; align-items: start; }
  #lista .card.vazio { grid-column: 1 / -1; }
}
.btn-atualizar { width: min(100%, 520px); margin-left: auto; margin-right: auto; }
.hist-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; font-weight: 700; font-size: 14px; }
.hist-bar select { flex: 1 1 120px; min-width: 0; padding: 10px 8px; border-radius: 10px; border: 1.5px solid var(--borda); background: #fff; font-size: 15px; font-weight: 600; color: var(--txt); }
.hist-sum { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.hist-sum > div { background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 10px 14px; }
.hist-sum small { display: block; color: var(--mut); font-size: 12px; font-weight: 600; }
.hist-sum b { font-size: 22px; }
.hist-tit { grid-column: 1 / -1; margin: 2px 2px 8px; font-size: 14px; font-weight: 700; color: var(--mut); }
/* Instalar o app (PWA) */
#inst { position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); z-index: 50; max-width: 536px; margin: 0 auto; background: #fff; border: 1.5px solid var(--verde2); border-radius: 16px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; align-items: center; gap: 10px; }
#inst img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
#inst .t { flex: 1; min-width: 0; line-height: 1.25; }
#inst .t b { display: block; font-size: 15px; }
#inst .t small { color: var(--mut); font-size: 12.5px; }
#inst .ok { border: 0; background: var(--verde); color: #fff; font-weight: 800; padding: 11px 16px; border-radius: 12px; }
#inst .x { border: 0; background: transparent; color: var(--mut); font-size: 22px; width: 36px; height: 36px; }
#inst-help { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; padding: 14px; }
#inst-help .sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 18px; padding: 20px 18px calc(18px + var(--safe-b)); }
#inst-help h3 { margin: 0 0 10px; font-size: 18px; }
#inst-help ol { margin: 0 0 10px; padding-left: 22px; line-height: 1.5; }
#inst-help p { margin: 0 0 12px; color: var(--mut); font-size: 13.5px; }
#inst-help button { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--verde); color: #fff; font-weight: 800; font-size: 16px; }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="tela-login" class="login">
  <form class="login-box" id="form-login" autocomplete="on">
    <img src="img/logo.png" alt="" onerror="this.style.display='none'">
    <h1>Entregas</h1>
    <p class="sub">Entre com o e-mail e a senha que o restaurante cadastrou para você.</p>
    <label for="lg-email">E-mail</label>
    <input id="lg-email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" required>
    <label for="lg-senha">Senha</label>
    <div class="senha-wrap">
      <input id="lg-senha" type="password" autocomplete="current-password" required>
      <button type="button" class="ver-senha" id="lg-ver" aria-label="Mostrar senha" aria-pressed="false">👁</button>
    </div>
    <button class="btn-prim" id="lg-btn" type="submit">Entrar</button>
    <div class="msg-erro hide" id="lg-erro"></div>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="tela-app" class="hide">
  <header class="top">
    <div class="wrap">
      <img class="logo" src="img/logo.png" alt="" onerror="this.style.display='none'">
      <div class="quem">
        <b id="tp-nome">Motoqueiro</b>
        <small><span class="dot" id="tp-dot"></span><span id="tp-loja">—</span></small>
      </div>
      <button class="ib" id="bt-som" title="Som dos avisos" aria-label="Som dos avisos">🔔</button>
      <button class="ib" id="bt-som-cfg" title="Configurar som" aria-label="Configurar som">⚙</button>
      <button class="ib" id="bt-sair" title="Sair" aria-label="Sair">⎋</button>
    </div>
  </header>

  <main class="wrap">
    <div class="aviso hide" id="av-notif"></div>
    <div class="mets">
      <div class="met"><small>Para sair</small><b id="m-sair">0</b></div>
      <div class="met"><small>Na rua</small><b id="m-rua">0</b></div>
      <div class="met"><small>Hoje</small><b id="m-hoje">0</b></div>
    </div>
    <div class="ganhos" id="tx-dia"></div>
    <div class="tabs" id="tabs">
      <button data-t="preparo">Em preparo</button>
      <button data-t="sair">Para sair</button>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyA2SuwKCvrvReKI4Q61hWHych-HPY8c1Tg",
    authDomain: "caixa-select-sabor.firebaseapp.com",
    databaseURL: "https://caixa-select-sabor-default-rtdb.firebaseio.com",
    projectId: "caixa-select-sabor"
  };
  var ID_OK = /^[-A-Za-z0-9_]{8,40}$/;

  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function round(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }
  function brl(v) { return 'R$ ' + (+v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function dia(ts) { var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function hoje(ts) { return !!ts && dia(ts) === dia(Date.now()); }
  function hora(ts) { if (!ts) return ''; var d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function ha(ts) {
    if (!ts) return '';
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return 'agora';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    return h < 24 ? 'há ' + h + ' h' : 'há ' + Math.floor(h / 24) + ' d';
  }
  function foneWa(t) { var d = String(t || '').replace(/\D/g, ''); if (!d) return ''; if (d.length <= 11) d = '55' + d; return d; }

  /* ---------- Estado ---------- */
  // App com nome próprio: o login do motoqueiro fica separado do login do painel (mesmo navegador/endereço).
  var app = firebase.initializeApp(FIREBASE_CONFIG, 'motoqueiro');
  var auth = app.auth(), db = app.database();
  var eu = null;            // { uid, lojaId, nome, ativo }
  var cfg = null, cardapio = {}, pedidos = [];
  var tab = 'sair';
  var histSel = null, hist = { mes: '', lista: [], carregando: false, erro: false, parcial: false };
  var escutas = [];         // referências com .on() para desligar ao sair
  var prontosVistos = null; // 1ª carga não dispara aviso
  var preparoVistos = null; // idem, para pedidos aceitos (em preparo)
  var som = lsGet('motSom', '1') !== '0';
  var swReg = null;
  var wake = null;
  var audio = null;
  var alertaTimer = null;
  var recusas = {}, recusasOk = false; // entregas que ESTE motoqueiro recusou (não tocam mais para ele)
  var chamadaT = null, chamadaKey = null, acaoPend = null;

  function ref(p) { return db.ref('caixa/' + p); }
  function pedRef(id) { return ref('pedidos/' + eu.lojaId + '/' + id); }
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
  var ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  /* ---------- Toast e modal ---------- */
  var toastT = null;
  function toast(msg, ok) {
    var t = $('#toast'); t.textContent = msg; t.className = (ok === false ? 'erro ' : '') + 'on';
    clearTimeout(toastT); toastT = setTimeout(function () { t.className = ok === false ? 'erro' : ''; }, 3200);
  }
  function modal(titulo, corpo, okTxt, onOk) {
    var m = $('#modal');
    m.innerHTML = '<div class="m"><h3>' + esc(titulo) + '</h3><div>' + corpo + '</div><div class="bs"><button id="md-nao">Voltar</button><button class="p" id="md-sim">' + esc(okTxt) + '</button></div></div>';
    m.classList.remove('hide');
    $('#md-nao').onclick = function () { m.classList.add('hide'); };
    $('#md-sim').onclick = function () { m.classList.add('hide'); onOk(); };
  }

  /* ---------- Login ---------- */
  function erroAuth(c) {
    return ({
      'auth/invalid-email': 'E-mail inválido.',
      'auth/user-disabled': 'Este acesso foi desativado. Fale com o restaurante.',
      'auth/user-not-found': 'E-mail ou senha incorretos.',
      'auth/wrong-password': 'E-mail ou senha incorretos.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/invalid-login-credentials': 'E-mail ou senha incorretos.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
      'auth/network-request-failed': 'Sem internet. Verifique a conexão.'
    })[c] || 'Não foi possível entrar. Tente de novo.';
  }
  /* Mostrar/ocultar senha no login */
  (function () {
    var b = document.getElementById('lg-ver'), i = document.getElementById('lg-senha');
    if (!b || !i) return;
    b.onclick = function () {
      var mostrar = i.type === 'password';
      i.type = mostrar ? 'text' : 'password';
      b.textContent = mostrar ? '🙈' : '👁';
      b.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
      b.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
      i.focus();
    };
  })();
  function loginErro(msg) { var e = $('#lg-erro'); e.textContent = msg || ''; e.classList.toggle('hide', !msg); }

  $('#form-login').addEventListener('submit', function (ev) {
    ev.preventDefault();
    destravarAudio();
    loginErro('');
    var b = $('#lg-btn'); b.disabled = true; b.textContent = 'Entrando…';
    auth.signInWithEmailAndPassword($('#lg-email').value.trim(), $('#lg-senha').value)
      .catch(function (e) { loginErro(erroAuth(e && e.code)); })
      .then(function () { b.disabled = false; b.textContent = 'Entrar'; });
  });
  $('#bt-sair').addEventListener('click', function () {
    modal('Sair do app?', 'Você deixará de receber os avisos de entrega neste aparelho.', 'Sair', function () { auth.signOut(); });
  });

  auth.onAuthStateChanged(function (user) {
    desligar();
    if (!user) { eu = null; mostrar('login'); return; }
    ref('motoqueirosUid/' + user.uid).once('value').then(function (s) {
      var v = s.val();
      if (!v || v.ativo !== true || !/^[A-Za-z0-9_-]{1,60}$/.test(String(v.lojaId || ''))) {
        loginErro('Seu acesso ainda não está liberado. Fale com o restaurante.');
        auth.signOut(); return;
      }
      eu = { uid: user.uid, lojaId: v.lojaId, nome: String(v.nome || '').slice(0, 40), ativo: true };
      mostrar('app');
      iniciar();
      ativarPush();
    }).catch(function (e) {
      console.error(e);
      loginErro('Não foi possível carregar seu cadastro. Verifique a internet e tente de novo.');
      auth.signOut();
    });
  });

  function mostrar(qual) {
    $('#tela-login').classList.toggle('hide', qual !== 'login');
    $('#tela-app').classList.toggle('hide', qual !== 'app');
    if (qual === 'login') { $('#lg-senha').value = ''; $('#lg-senha').type = 'password'; $('#lg-ver').textContent = '👁'; document.title = 'Entregas — Motoqueiro'; atualizarBadge(0); }
  }

  /* ---------- Escutas do Firebase ---------- */
  function ouvir(r, evento, fn, fnErro) { r.on(evento, fn, fnErro || function (e) { console.warn(e && e.message); }); escutas.push([r, evento, fn]); }
  function desligar() { escutas.forEach(function (x) { try { x[0].off(x[1], x[2]); } catch (e) {} }); escutas = []; prontosVistos = null; preparoVistos = null; recusas = {}; recusasOk = false; acaoPend = null; loopParar(); chamadaParar(); }

  function iniciar() {
    $('#tp-nome').textContent = eu.nome || 'Motoqueiro';
    $('#bt-som').textContent = som ? '🔔' : '🔕';
    $('#bt-som').classList.toggle('off', !som);
    ouvir(db.ref('.info/connected'), 'value', function (s) { $('#tp-dot').classList.toggle('on', s.val() === true); });
    ouvir(ref('motoqueirosUid/' + eu.uid), 'value', function (s) {
      var v = s.val();
      if (!v || v.ativo !== true) { loginErro('Seu acesso foi desativado pelo restaurante.'); auth.signOut(); return; }
      if (v.nome && v.nome !== eu.nome) { eu.nome = String(v.nome).slice(0, 40); $('#tp-nome').textContent = eu.nome; }
    });
    ouvir(ref('pedidosConfig/' + eu.lojaId), 'value', function (s) {
      cfg = s.val(); $('#tp-loja').textContent = (cfg && cfg.nome) || 'Restaurante'; render();
    });
    ouvir(ref('cardapio/' + eu.lojaId), 'value', function (s) { cardapio = s.val() || {}; render(); });
    // O motoqueiro só enxerga (regras do Firebase): pedidos em preparo (já aceitos pela loja, para ele ir
    // se deslocando), entregas prontas que ninguém pegou + as dele.
    // Entregas que este motoqueiro recusou (cada um lê só as suas)
    ouvir(ref('recusasEntrega/' + eu.lojaId + '/' + eu.uid).limitToLast(200), 'value', function (s) {
      recusas = s.val() || {}; recusasOk = true; render();
    }, function (e) { recusasOk = true; console.warn('[recusas] sem acesso (publique as regras novas do Firebase):', e && e.message); chamadaAtualizar(); });
    var prontosMap = {}, preparoMap = {}, meusMap = {};
    var prim = { pronto: false, preparo: false, meus: false }; // só avisa depois que as 3 listas chegaram
    function juntar() {
      var tudo = Object.assign({}, prontosMap, preparoMap, meusMap);
      pedidos = Object.keys(tudo).filter(function (k) { return ID_OK.test(k); })
        .map(function (k) { return Object.assign({ id: k }, tudo[k]); })
        .filter(function (p) { return p.tipo === 'entrega'; });
      if (prim.pronto && prim.preparo && prim.meus) detectar();
      render();
    }
    var semAcesso = function (q) { return function (e) { prim[q] = true; toast('Sem acesso aos pedidos. Fale com o restaurante.', false); console.warn(e); juntar(); }; };
    ouvir(ref('pedidos/' + eu.lojaId).orderByChild('status').equalTo('pronto').limitToLast(100), 'value', function (s) {
      prontosMap = s.val() || {}; prim.pronto = true; juntar();
    }, semAcesso('pronto'));
    // Em preparo: se as regras do Firebase ainda não foram atualizadas, só não mostra essa aba (sem aviso de erro).
    ouvir(ref('pedidos/' + eu.lojaId).orderByChild('status').equalTo('preparo').limitToLast(100), 'value', function (s) {
      preparoMap = s.val() || {}; prim.preparo = true; juntar();
    }, function (e) { console.warn('[preparo] sem acesso (publique as regras novas do Firebase):', e && e.message); prim.preparo = true; juntar(); });
    ouvir(ref('pedidos/' + eu.lojaId).orderByChild('motoqueiro').equalTo(eu.nome).limitToLast(100), 'value', function (s) {
      meusMap = s.val() || {}; prim.meus = true; juntar();
    }, semAcesso('meus'));
    avisoNotif();
    travarTela();
  }

  /* ---------- Totais ---------- */
  function totais(p) {
    var its = Object.keys(p.itens || {}).map(function (k) {
      var it = p.itens[k] || {}, c = cardapio[k];
      var preco = typeof it.p === 'number' ? it.p : (c ? ((parseFloat(c.promo) > 0 && parseFloat(c.promo) < parseFloat(c.preco)) ? parseFloat(c.promo) : (parseFloat(c.preco) || 0)) : 0);
      return { q: parseInt(it.q) || 0, n: it.n || (c && c.nome) || 'Item', preco: preco };
    });
    var sub = round(its.reduce(function (s, i) { return s + i.preco * i.q; }, 0));
    var conf = typeof p.total === 'number';
    var taxa = conf ? (parseFloat(p.taxa) || 0) : (parseFloat((cfg || {}).taxaEntrega) || 0);
    return { its: its, taxa: taxa, total: conf ? p.total : round(sub + taxa) };
  }
  function tsEntrega(p) { return (p.hist && p.hist.entregue) || p.atualizadoEm || p.ts || 0; }
  function meu(p) { return !p.motoqueiro || p.motoqueiro === eu.nome; }
  function listas() {
    return {
      preparo: pedidos.filter(function (p) { return p.status === 'preparo'; }).sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); }),
      sair: pedidos.filter(function (p) { return p.status === 'pronto'; }).sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); }),
      rua: pedidos.filter(function (p) { return p.status === 'saiu' && meu(p); }).sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); }),
      hoje: pedidos.filter(function (p) { return p.status === 'entregue' && p.motoqueiro === eu.nome && hoje(tsEntrega(p)); }).sort(function (a, b) { return tsEntrega(b) - tsEntrega(a); })
    };
  }

  /* ---------- Saldo total = acumulado do MÊS (zera sozinho quando o mês vira) ----------
     O Firebase só entrega as últimas 100 entregas ao motoqueiro; por isso o acumulado do mês fica
     guardado também neste aparelho (por pedido, então nada é contado duas vezes). */
  function mesDe(ts) { var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1); }
  function saldoMes() {
    var mes = mesDe(Date.now()), k = 'motMes_' + eu.uid, reg = null, mudou = false;
    try { reg = JSON.parse(lsGet(k, 'null')); } catch (e) { reg = null; }
    if (!reg || reg.m !== mes || !reg.t || typeof reg.t !== 'object') { reg = { m: mes, t: {} }; mudou = true; }
    pedidos.forEach(function (p) {
      if (p.status !== 'entregue' || p.motoqueiro !== eu.nome) return;
      var ts = tsEntrega(p); if (!ts || mesDe(ts) !== mes) return;
      var tx = round(totais(p).taxa), a = reg.t[p.id];
      if (!a || a[0] !== ts || a[1] !== tx) { reg.t[p.id] = [ts, tx]; mudou = true; }
    });
    if (mudou) lsSet(k, JSON.stringify(reg));
    var soma = 0; Object.keys(reg.t).forEach(function (id) { soma += +reg.t[id][1] || 0; });
    return round(soma);
  }

  /* ---------- Histórico por mês ----------
     Busca (uma vez) as entregas deste motoqueiro e filtra pelo mês escolhido. */
  var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  function chaveMes(ts) { var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function dataBR(ts) { var d = new Date(ts); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
  function histBuscar() {
    if (!eu || !histSel) return;
    var m = histSel;
    hist.carregando = true; hist.erro = false; hist.parcial = false; render();
    // Tenta até 1000 entregas; se as regras do Firebase ainda forem as antigas (limite de 100), usa as últimas 100.
    function buscar(limite) {
      ref('pedidos/' + eu.lojaId).orderByChild('motoqueiro').equalTo(eu.nome).limitToLast(limite).once('value').then(function (s) {
        if (histSel !== m) return;
        var tudo = s.val() || {};
        hist.lista = Object.keys(tudo).filter(function (k) { return ID_OK.test(k); })
          .map(function (k) { return Object.assign({ id: k }, tudo[k]); })
          .filter(function (p) { return p.tipo === 'entrega' && p.status === 'entregue' && p.motoqueiro === eu.nome && chaveMes(tsEntrega(p)) === m; })
          .sort(function (a, b) { return tsEntrega(b) - tsEntrega(a); });
        hist.mes = m; hist.carregando = false; hist.parcial = limite < 1000; render();
      }).catch(function (e) {
        if (histSel !== m) return;
        console.warn('[historico]', limite, e && e.message);
        if (limite > 100) { buscar(100); return; }
        hist.carregando = false; hist.erro = true; render();
      });
    }
    buscar(1000);
  }
  function histRender() {
    var el = $('#lista');
    if (!el.firstChild || el.firstChild.id !== 'hist-bar') {
      var agora = new Date(), anoAtual = agora.getFullYear();
      var optM = MESES.map(function (n, k) { return '<option value="' + String(k + 1).padStart(2, '0') + '">' + n + '</option>'; }).join('');
      var optA = ''; for (var a = anoAtual; a >= anoAtual - 3; a--) optA += '<option value="' + a + '">' + a + '</option>';
      el.innerHTML = '<div class="hist-bar" id="hist-bar"><span>📅 Mês</span><select id="f-hmes" aria-label="Mês">' + optM + '</select><select id="f-hano" aria-label="Ano">' + optA + '</select></div>';
      var trocar = function () { histSel = $('#f-hano').value + '-' + $('#f-hmes').value; histBuscar(); };
      $('#f-hmes').addEventListener('change', trocar);
      $('#f-hano').addEventListener('change', trocar);
    }
    var sm = $('#f-hmes'), sa = $('#f-hano'), p = (histSel || '').split('-');
    if (p.length === 2) { sa.value = p[0]; sm.value = p[1]; }
    while (el.children.length > 1) el.removeChild(el.lastChild);
    var ocultar = lsGet('motGanhosOculto', '0') === '1', v = function (t) { return ocultar ? 'R$ ••••' : t; };
    var nomeMes = p.length === 2 ? MESES[(+p[1]) - 1] + ' de ' + p[0] : '';
    var h;
    if (hist.carregando) h = '<div class="card vazio">Buscando o histórico…</div>';
    else if (hist.erro) h = '<div class="card vazio">Não foi possível carregar o histórico.<br>Verifique a internet e toque em “Atualizar status”.</div>';
    else if (hist.mes !== histSel) h = '';
    else if (!hist.lista.length) h = '<div class="card vazio">Nenhuma entrega em ' + esc(nomeMes) + '.</div>';
    else {
      var soma = 0; hist.lista.forEach(function (x) { soma += totais(x).taxa; });
      h = '<div class="hist-sum"><div><small>Entregas em ' + esc(nomeMes) + '</small><b>' + hist.lista.length + '</b></div><div><small>Ganhos (taxas)</small><b>' + v(brl(round(soma))) + '</b></div></div>' +
        '<div class="hist-tit">Mais recentes primeiro' + (hist.parcial ? ' · mostrando só as últimas 100 entregas' : '') + '</div>' + hist.lista.map(cartao).join('');
    }
    el.insertAdjacentHTML('beforeend', h);
  }

  /* ---------- Render ---------- */
  function render() {
    if (!eu) return;
    var L = listas();
    $('#m-sair').textContent = L.sair.length;
    $('#m-rua').textContent = L.rua.length;
    $('#m-hoje').textContent = L.hoje.length;
    // Ganhos = soma das taxas de entrega (o que o motoqueiro tem a receber)
    var taxasDia = 0, taxasRua = 0;
    L.hoje.forEach(function (p) { taxasDia += totais(p).taxa; });
    L.rua.forEach(function (p) { taxasRua += totais(p).taxa; });
    var aceitas = pedidos.filter(function (p) {
      return p.motoqueiro === eu.nome && ((p.hist && hoje(p.hist.saiu)) || (p.status === 'entregue' && hoje(tsEntrega(p))));
    }).length;
    var recusadas = Object.keys(recusas).filter(function (k) { return hoje(recusas[k]); }).length;
    var ocultar = lsGet('motGanhosOculto', '0') === '1';
    var v = function (txt) { return ocultar ? 'R$ ••••' : txt; };
    $('#tx-dia').innerHTML =
      '<div class="ganhos-top"><h3>Seus ganhos <button type="button" id="bt-olho" aria-label="' + (ocultar ? 'Mostrar valores' : 'Ocultar valores') + '">' + (ocultar ? '🙈' : '👁') + '</button></h3></div>' +
      '<div class="ganhos-g">' +
        '<div class="g-box g-dia"><small>Ganhos do dia</small><b>' + v(brl(round(taxasDia))) + '</b>' +
          (L.rua.length ? '<div class="rua">+ ' + v(brl(round(taxasRua))) + ' na rua</div>' : '') +
          '<div class="saldo">Saldo total: ' + v(brl(saldoMes())) + '</div></div>' +
        '<div class="g-box g-st">' +
          '<div class="l"><span>Rotas aceitas</span><b>' + aceitas + '</b></div>' +
          '<div class="l"><span>Finalizadas</span><b>' + L.hoje.length + '</b></div>' +
          '<div class="l"><span>Recusadas</span><b>' + recusadas + '</b></div>' +
        '</div>' +
      '</div>';
    var olho = $('#bt-olho'); if (olho) olho.onclick = function () { lsSet('motGanhosOculto', ocultar ? '0' : '1'); render(); };
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.dataset.t === tab); });
    document.title = (L.sair.length ? '(' + L.sair.length + ') ' : '') + 'Entregas';
    atualizarBadge(L.sair.length);
